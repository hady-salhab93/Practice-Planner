services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: practice_planner
      POSTGRES_USER: practice_planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-practice_planner_dev}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - practice-planner-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice_planner -d practice_planner"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  practice-planner-postgres:
